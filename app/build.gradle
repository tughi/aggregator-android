apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    namespace 'com.tughi.aggregator'
    compileSdk = 36

    defaultConfig {
        applicationId 'com.tughi.aggregator'

        minSdk 23
        targetSdk 35

        multiDexEnabled false

        versionName "Preview:035"
        versionCode 299035
    }

    buildFeatures {
        buildConfig true
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'

            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions += 'store'

    productFlavors {
        create('fdroid') {
            dimension 'store'
        }
        create('google') {
            dimension 'store'
            applicationIdSuffix '.next'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.browser:browser:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.sqlite:sqlite-framework:2.6.1'
    implementation 'androidx.sqlite:sqlite-ktx:2.6.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'com.amazon.ion:ion-element:1.0.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'commons-codec:commons-codec:1.20.0'

    implementation project(':sax-framework')
}
